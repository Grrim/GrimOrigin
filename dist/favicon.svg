<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark circle background -->
  <circle cx="16" cy="16" r="15" fill="#0E0E12" stroke="#3A9BE7" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Orbital ring -->
  <ellipse cx="16" cy="16" rx="11" ry="4.5" stroke="#3A9BE7" stroke-width="0.8" stroke-opacity="0.6" transform="rotate(-20 16 16)"/>
  <!-- Core dot -->
  <circle cx="16" cy="16" r="3" fill="#3A9BE7"/>
  <!-- Glow -->
  <circle cx="16" cy="16" r="3" fill="#3A9BE7" opacity="0.3" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
